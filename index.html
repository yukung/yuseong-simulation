$('phases').innerHTML=PH.map((k,i)=>`<button class="pill" data-i="${i}" aria-pressed="false">${NAME[k]}</button>`).join('');

$('time').oninput=()=>{t=+$('time').value;tick()};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Ⅱ 정지':'▶ 재생'};
setInterval(()=>{if(playing){t+=2.5;if(t>1380)t=330;tick()}},100);
$('plus').onclick=()=>{zoom*=1.4;draw()};$('minus').onclick=()=>{zoom=Math.max(.5,zoom/1.4);draw()};$('reset').onclick=()=>{zoom=1;cx=127.345;cy=36.385;draw()};
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY,cx,cy];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(drag){cx=drag[2]-(e.clientX-drag[0])/(base*zoom*.805);cy=drag[3]+(e.clientY-drag[1])/(base*zoom);draw()}};canvas.onpointerup=()=>drag=null;
canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.5,Math.min(30,zoom*Math.exp(-e.deltaY*.001)));draw()};window.onresize=resize;
